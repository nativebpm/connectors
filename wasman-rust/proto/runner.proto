syntax = "proto3";
package runner;

service WasmRunner {
  rpc ExecuteWasm (WasmRequest) returns (WasmResponse);
}

message WasmRequest {
  string instance_id = 1;
  bytes wasm_bytes = 2;
  bytes initial_variables = 3;
  int32 step_index = 4;
}

message WasmResponse {
  bytes updated_variables = 1;
  bool completed = 2;
  string error = 3;
}
