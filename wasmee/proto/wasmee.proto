syntax = "proto3";
package wasmee;
option go_package = "github.com/nativebpm/connectors/wasmee/proto";

service WasmeeExecutor {
  rpc Execute(stream ExecuteMessage) returns (stream ExecuteMessage);
}

message ExecuteMessage {
  oneof message {
    StartRequest start = 1;
    HostCallRequest host_call_request = 2;
    HostCallResponse host_call_response = 3;
    CheckpointRequest checkpoint = 4;
    CheckpointResponse checkpoint_response = 5;
    CompleteResponse complete = 6;
  }
}

message OplogEntry {
  int32 call_index = 1;
  string api_name = 2;
  bytes request_payload = 3;
  bytes response_payload = 4;
}

message StartRequest {
  string instance_id = 1;
  bytes wasm_bytes = 2;
  string entrypoint = 3;
  repeated uint64 params = 4;
  bytes base_snapshot = 5;
  map<int32, bytes> memory_deltas = 6;
  repeated OplogEntry oplog = 7;
  int32 call_index = 8;
}

message HostCallRequest {
  string api_name = 1;
  bytes request_payload = 2;
  int32 call_index = 3;
}

message HostCallResponse {
  bytes response_payload = 1;
  string error = 2;
}

message CheckpointRequest {
  bytes current_memory = 1;
}

message CheckpointResponse {
  string error = 1;
}

message CompleteResponse {
  bool crashed = 1;
  string error = 2;
  map<int32, bytes> final_deltas = 3;
  repeated OplogEntry final_oplog = 4;
}
