name: Publish httpclient module

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.email "bot@nativebpm.com"
          git config --global user.name "nativebpm-bot"

      - name: Clone target repository
        env:
          PAT_PUSH: ${{ secrets.PAT_PUSH }}
        run: |
          git clone https://x-access-token:${PAT_PUSH}@github.com/nativebpm/httpclient.git ../httpclient-tmp

      - name: Skip pre-release tags
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "Detected tag: $TAG_NAME"
          # Only allow tags like v1.2.3 — skip alpha/beta/rc suffixes
          if [[ "$TAG_NAME" =~ -(alpha|beta|rc) ]]; then
            echo "🚫 Pre-release tag detected ($TAG_NAME). Skipping publish."
            exit 0
          fi

      - name: Sync module code
        run: |
          rm -rf ../httpclient-tmp/*
          cp -r httpclient/* ../httpclient-tmp/

      - name: Rewrite go.mod module path
        run: |
          sed -i 's|module github.com/nativebpm/connectors/httpclient|module github.com/nativebpm/httpclient|' ../httpclient-tmp/go.mod

      - name: Commit and push changes
        env:
          PAT_PUSH: ${{ secrets.PAT_PUSH }}
        run: |
          cd ../httpclient-tmp
          git add .
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: sync from connectors @ $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          # Ensure remote uses token-based authentication
          git remote set-url origin https://x-access-token:${PAT_PUSH}@github.com/nativebpm/httpclient.git
          git push origin main

      - name: Mirror tag to target repo
        env:
          PAT_PUSH: ${{ secrets.PAT_PUSH }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          cd ../httpclient-tmp
          git remote set-url origin https://x-access-token:${PAT_PUSH}@github.com/nativebpm/httpclient.git

          # Skip if tag already exists in target repo
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists in target repo, skipping."
            exit 0
          fi

          # Create and push the same stable tag
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
          echo "✅ Mirrored stable tag $TAG_NAME to httpclient"