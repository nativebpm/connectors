name: Publish module from connectors

on:
  push:
    tags:
      - "*/v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.email "bot@nativebpm.com"
          git config --global user.name "nativebpm-bot"

      - name: Extract module and tag info
        id: taginfo
        run: |
          FULL_TAG=${GITHUB_REF#refs/tags/}
          echo "Full tag: $FULL_TAG"

          MODULE_NAME=$(echo "$FULL_TAG" | cut -d'/' -f1)
          TAG_NAME=$(echo "$FULL_TAG" | cut -d'/' -f2)

          echo "MODULE_NAME=$MODULE_NAME" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

          if [[ -z "$MODULE_NAME" || -z "$TAG_NAME" ]]; then
            echo "❌ Invalid tag format. Expected <module>/vX.Y.Z"
            exit 1
          fi

          # Skip pre-release tags
          if [[ "$TAG_NAME" =~ -(alpha|beta|rc) ]]; then
            echo "🚫 Pre-release tag detected ($TAG_NAME). Skipping publish."
            exit 0
          fi

      - name: Clone target repository
        env:
          PAT_PUSH: ${{ secrets.PAT_PUSH }}
        run: |
          MODULE=${{ steps.taginfo.outputs.MODULE_NAME }}
          git clone https://x-access-token:${PAT_PUSH}@github.com/nativebpm/${MODULE}.git ../${MODULE}-tmp

      - name: Sync module code
        run: |
          MODULE=${{ steps.taginfo.outputs.MODULE_NAME }}
          rm -rf ../${MODULE}-tmp/*
          cp -r ${MODULE}/* ../${MODULE}-tmp/

      - name: Update README links
        run: |
          MODULE=${{ steps.taginfo.outputs.MODULE_NAME }}
          FILES=$(find ../${MODULE}-tmp -type f -name "*.md")
          for f in $FILES; do
            sed -i "s|github.com/nativebpm/connectors/${MODULE}|github.com/nativebpm/${MODULE}|g" "$f"
          done

      - name: Rewrite go.mod module path
        run: |
          MODULE=${{ steps.taginfo.outputs.MODULE_NAME }}
          sed -i "s|module github.com/nativebpm/connectors/${MODULE}|module github.com/nativebpm/${MODULE}|" ../${MODULE}-tmp/go.mod

      - name: Commit and push changes
        env:
          PAT_PUSH: ${{ secrets.PAT_PUSH }}
        run: |
          MODULE=${{ steps.taginfo.outputs.MODULE_NAME }}
          cd ../${MODULE}-tmp
          git add .
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: sync from connectors @ $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          git remote set-url origin https://x-access-token:${PAT_PUSH}@github.com/nativebpm/${MODULE}.git
          git push origin main

      - name: Mirror stable tag to target repo
        env:
          PAT_PUSH: ${{ secrets.PAT_PUSH }}
        run: |
          MODULE=${{ steps.taginfo.outputs.MODULE_NAME }}
          TAG_NAME=${{ steps.taginfo.outputs.TAG_NAME }}
          cd ../${MODULE}-tmp
          git remote set-url origin https://x-access-token:${PAT_PUSH}@github.com/nativebpm/${MODULE}.git

          # Skip if tag already exists
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists, skipping."
            exit 0
          fi

          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Check if tag has message
        id: tagmsg
        run: |
          MODULE=${{ steps.taginfo.outputs.MODULE_NAME }}
          TAG_NAME=${{ steps.taginfo.outputs.TAG_NAME }}
          cd ../${MODULE}-tmp

          TAG_MSG=$(git for-each-ref refs/tags/$TAG_NAME --format='%(contents)')

          if [ -z "$TAG_MSG" ]; then
            echo "CREATE_RELEASE=false" >> $GITHUB_OUTPUT
          else
            echo "CREATE_RELEASE=true" >> $GITHUB_OUTPUT
            echo "RELEASE_TITLE=$TAG_MSG" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        if: steps.tagmsg.outputs.CREATE_RELEASE == 'true'
        run: |
          MODULE=${{ steps.taginfo.outputs.MODULE_NAME }}
          TAG_NAME=${{ steps.taginfo.outputs.TAG_NAME }}
          cd ../${MODULE}-tmp

          LAST_TAG=$(git tag --sort=-creatordate | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | head -n 1)
          if [ -z "$LAST_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s")
          else
            CHANGELOG=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s")
          fi

          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release in mirror repo
        if: steps.tagmsg.outputs.CREATE_RELEASE == 'true'
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_PUSH }}
        with:
          tag_name: ${{ steps.taginfo.outputs.TAG_NAME }}
          name: ${{ steps.tagmsg.outputs.RELEASE_TITLE }}
          body: |
            Automated release of module ${{ steps.taginfo.outputs.MODULE_NAME }}.

            ## Changelog
            ${{ env.CHANGELOG }}
