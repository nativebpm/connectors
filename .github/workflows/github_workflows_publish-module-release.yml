name: Mirror module & release on annotated tag

on:
  push:
    tags:
      - "*/v*"

permissions:
  contents: read

jobs:
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      HAS_MESSAGE: ${{ steps.meta.outputs.HAS_MESSAGE }}
      MODULE_NAME: ${{ steps.meta.outputs.MODULE_NAME }}
      TAG_NAME: ${{ steps.meta.outputs.TAG_NAME }}
      TAG_MESSAGE: ${{ steps.meta.outputs.TAG_MESSAGE }}
    steps:
      - name: Checkout repository with full history (tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract tag, module and annotation
        id: meta
        run: |
          FULL_TAG_REF="${GITHUB_REF#refs/tags/}"
          echo "Full incoming tag: $FULL_TAG_REF"

          MODULE_NAME="$(echo "$FULL_TAG_REF" | cut -d'/' -f1)"
          TAG_NAME="$(echo "$FULL_TAG_REF" | cut -d'/' -f2-)"

          # Basic validation: ensure we have both parts and the tag looks like a semver vX.Y.Z
          if [[ -z "$MODULE_NAME" || -z "$TAG_NAME" ]]; then
            echo "❌ Invalid tag format. Expected <module>/vX.Y.Z"
            exit 1
          fi

          if ! echo "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Invalid tag name format. Expected vX.Y.Z (example: v1.2.3). Got: $TAG_NAME"
            exit 1
          fi

          # Double-check that the module directory exists in the monorepo early
          if [[ ! -d "$MODULE_NAME" ]]; then
            echo "❌ Module directory '$MODULE_NAME' not found in monorepo."
            exit 1
          fi

          # Read the tag annotation/body reliably. Use git tag -l --format to get annotation message.
          TAG_MSG="$(git tag -l --format='%(contents)' "$FULL_TAG_REF" 2>/dev/null || true)"
          TAG_MSG_STRIPPED="$(echo "$TAG_MSG" | sed '/^[[:space:]]*$/d')"

          if [[ -z "$TAG_MSG_STRIPPED" ]]; then
            echo "⚠️ Tag has no annotation message. Skipping job."
            echo "HAS_MESSAGE=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "MODULE_NAME=$MODULE_NAME" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          {
            echo "TAG_MESSAGE<<EOF_MSG" >> $GITHUB_OUTPUT
            echo "$TAG_MSG" >> $GITHUB_OUTPUT
            echo "EOF_MSG" >> $GITHUB_OUTPUT
          } >> $GITHUB_OUTPUT
          echo "HAS_MESSAGE=true" >> $GITHUB_OUTPUT

  mirror-and-release:
    needs: check-tag
    if: needs.check-tag.outputs.HAS_MESSAGE == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history (tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone mirror repository
        if: needs.check-tag.outputs.HAS_MESSAGE == 'true'
        env:
          PAT_PUSH: ${{ secrets.PAT_PUSH }}
        run: |
          git clone "https://x-access-token:${PAT_PUSH}@github.com/nativebpm/${{ needs.check-tag.outputs.MODULE_NAME }}.git" mirror-repo
          cd mirror-repo
          git config user.name "nativebpm-bot"
          git config user.email "bot@nativebpm.com"
          git fetch --tags --force

      - name: Sync module sources into mirror main (rm + cp)
        if: needs.check-tag.outputs.HAS_MESSAGE == 'true'
        run: |
          MODULE="${{ needs.check-tag.outputs.MODULE_NAME }}"
          if [[ ! -d "$MODULE" ]]; then
            echo "❌ Module directory '$MODULE' not found in monorepo."
            exit 1
          fi

          cd mirror-repo
          git config user.name "nativebpm-bot"
          git config user.email "bot@nativebpm.com"
          git checkout main || git checkout -b main

          # Удаляем всё, кроме .git
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          # Копируем содержимое папки модуля (включая скрытые файлы) в корень зеркала
          cp -a "../${MODULE}/." "./"

          # Правим go.mod (если он от монорепо)
          if [[ -f go.mod ]]; then
            sed -i "s|module github.com/nativebpm/connectors/${MODULE}|module github.com/nativebpm/${MODULE}|" go.mod || true
          fi

          # Обновляем ссылки в файлах (Markdown и прочие текстовые, где встречается шаблон)
          grep -Ilr "github.com/nativebpm/connectors/${MODULE}" . | while read -r f; do
            sed -i "s|github.com/nativebpm/connectors/${MODULE}|github.com/nativebpm/${MODULE}|g" "$f"
          done || true

          git add .
          if git diff --cached --quiet; then
            echo "No content changes for module."
          else
            git config user.name "nativebpm-bot"
            git config user.email "bot@nativebpm.com"
            git commit -m "chore: sync module '${MODULE}' from connectors @ $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push origin main
          fi

      - name: Create annotated tag in mirror (if not exists)
        if: needs.check-tag.outputs.HAS_MESSAGE == 'true'
        env:
          TAG_NAME: ${{ needs.check-tag.outputs.TAG_NAME }}
        run: |
          cd mirror-repo
          git config user.name "nativebpm-bot"
          git config user.email "bot@nativebpm.com"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists in mirror. Skipping creation."
            exit 0
          fi
          printf "%s\n" "${{ needs.check-tag.outputs.TAG_MESSAGE }}" > /tmp/tagmsg.txt
          git tag -a "$TAG_NAME" -F /tmp/tagmsg.txt
          git push origin "$TAG_NAME"

      - name: Create release in mirror repository
        if: needs.check-tag.outputs.HAS_MESSAGE == 'true'
        env:
          PAT_PUSH: ${{ secrets.PAT_PUSH }}
          TAG_NAME: ${{ needs.check-tag.outputs.TAG_NAME }}
        run: |
          cd mirror-repo
          git config user.name "nativebpm-bot"
          git config user.email "bot@nativebpm.com"
          gh --version || true
          export GH_TOKEN="${PAT_PUSH}"

          # Use only the first non-empty line of the tag message as the release title (fallback to tag name if empty)
          printf "%s\n" "${{ needs.check-tag.outputs.TAG_MESSAGE }}" | sed -n '/[^[:space:]]/ { p; q }' > /tmp/release_title.txt
          if [[ ! -s /tmp/release_title.txt ]]; then
            echo "${TAG_NAME}" > /tmp/release_title.txt
          fi

          # Use the full tag annotation as the release body
          printf "%s\n" "${{ needs.check-tag.outputs.TAG_MESSAGE }}" > /tmp/release_body.md

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release for $TAG_NAME already exists. Skipping."
            exit 0
          fi

          gh release create "$TAG_NAME" --title "$(cat /tmp/release_title.txt)" --notes-file /tmp/release_body.md