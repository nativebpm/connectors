version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nativebpm-postgres
    environment:
      POSTGRES_USER: nativebpm
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nativebpm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: [
      "postgres",
      "-c", "max_connections=500",
      "-c", "shared_buffers=256MB",
      "-c", "work_mem=16MB",
      "-c", "synchronous_commit=off",
      "-c", "fsync=off"
    ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nativebpm -d nativebpm"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: nativebpm-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Helper service to auto-create S3 bucket in MinIO
  create-buckets:
    image: minio/mc:latest
    container_name: nativebpm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/nativebpm-snapshots || true;
      exit 0;
      "

  nativebpm:
    image: registry.gitlab.com/nativebpm/platform:latest
    container_name: nativebpm-server
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "6060:6060"
    environment:
      - S3_BUCKET=nativebpm-snapshots
      - S3_ENDPOINT=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
    command: ["-db", "postgres://nativebpm:password@postgres:5432/nativebpm?sslmode=disable", "-port", "8080"]

volumes:
  pgdata:
  miniodata:
