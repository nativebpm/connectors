version: "2"
run:
  modules-download-mode: readonly
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    gocyclo:
      min-complexity: 20
    lll:
      line-length: 150
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          severity: warning
          disabled: true
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
        text: Error return value of .*.Close.* is not checked
      - linters:
          - errcheck
        text: Error return value of `io.Copy` is not checked
      - linters:
          - errcheck
          - gocyclo
          - lll
        path: _test\.go
    paths:
      - "(.+/)?third_party/.*"
      - "(.+/)?builtin/.*"
      - "(.+/)?examples/.*"
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - "(.+/)?third_party/.*"
      - "(.+/)?builtin/.*"
      - "(.+/)?examples/.*"
