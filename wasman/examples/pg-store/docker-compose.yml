version: '3.7'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-demo
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: nativebpm_demo
      POSTGRES_USER: demo_user
      POSTGRES_PASSWORD: demo_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_user -d nativebpm_demo"]
      interval: 5s
      timeout: 5s
      retries: 5
